# Koyeb deployment descriptor for the nanobot gateway and its bundled WebUI.
#
#   koyeb compose ./koyeb-compose.yaml
#
# The service runs the image entrypoint, which prepares the data directory, drops
# privileges, seeds config.json from koyeb-config.json on first boot, and runs
# `nanobot gateway` in the foreground. Koyeb terminates TLS at the edge and
# routes the public domain to the WebUI/WebSocket port, so the browser talks
# https:// and wss:// to the same origin.
#
# Create the secrets referenced below before deploying:
#
#   koyeb secrets create anthropic-api-key --value "$ANTHROPIC_API_KEY"
#   koyeb secrets create nanobot-web-token --value "$(openssl rand -hex 32)"
#   koyeb secrets create pikpak-user --value "$PIKPAK_USER"
#   koyeb secrets create pikpak-password --value "$PIKPAK_PASSWORD"
#
# Sessions, memory, and WebUI history live in /home/nanobot/.nanobot. Koyeb
# volumes require a paid instance, so on the free tier the PIKPAK_USER and
# PIKPAK_PASSWORD secrets make the entrypoint mirror that directory to PikPak
# with rclone instead. See docs/deployment.md#persistent-data-on-the-free-tier.
app:
  name: nanobot

services:
  - definition:
      name: nanobot
      type: WEB
      git:
        repository: github.com/wzbtcbkrsz/nanobot
        branch: main
        # Keep deploys explicit so a push never restarts a live agent.
        no_deploy_on_push: true
        docker:
          dockerfile: ./Dockerfile
          # Keep the image entrypoint (it prepares the data directory, drops
          # privileges, and seeds the config) and replace the default
          # `webui --yes --no-open` command with the foreground gateway.
          entrypoint: ["/usr/local/bin/entrypoint.sh"]
          command: gateway
      regions:
        - fra
      instance_types:
        - scopes: ['region:fra']
          type: 'micro'
      scalings:
        - scopes: ['region:fra']
          min: 1
          max: 1
      ports:
        - port: 8765
          protocol: http
      routes:
        - port: 8765
          path: "/"
      # A TCP probe matches Koyeb's default and only needs the gateway socket to
      # be reachable; it does not depend on the bundled WebUI assets or a route.
      # The PikPak-backed store pulls the whole .nanobot dir (and logs in to the
      # remote) before the gateway binds, so a cold start can take minutes once
      # sessions and media have accumulated. A short grace period then fails the
      # probe, restarts into another slow pull, and loops until the instance is
      # replaced. Leave enough time for that pull and tolerate a few failures.
      health_checks:
        - tcp:
            port: 8765
          grace_period: 300
          interval: 30
          timeout: 5
          restart_limit: 5
      env:
        # Anthropic API key — powers the agent's LLM calls.
        - key: ANTHROPIC_API_KEY
          value: "{{secret.anthropic-api-key}}"
        # WebUI access secret — the gate for the public WebUI. Keep it private;
        # this is the password the browser asks for.
        - key: NANOBOT_WEB_TOKEN
          value: "{{secret.nanobot-web-token}}"
        # PikPak credentials for the free-tier persistent store (no volume).
        - key: PIKPAK_USER
          value: "{{secret.pikpak-user}}"
        - key: PIKPAK_PASSWORD
          value: "{{secret.pikpak-password}}"
        # Each upload walks the whole data dir, and a larger remote makes the
        # next startup pull slower. Pin the image's 300s default explicitly so
        # the value survives a service created from the control panel too.
        - key: PIKPAK_SYNC_INTERVAL
          value: "300"
