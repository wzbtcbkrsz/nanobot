x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NANOBOT_CHANNELS: ${NANOBOT_CHANNELS:-whatsapp}
  environment:
    NANOBOT_DOCKER_BOOTSTRAP: "1"
    NANOBOT_WEB_TOKEN: ${NANOBOT_WEB_TOKEN:-}
    NANOBOT_API_KEY: ${NANOBOT_API_KEY:-}
    # PikPak persistence activates when both credentials are set. Copy
    # .env.example to .env (git-ignored) to supply them locally.
    PIKPAK_USER: "${PIKPAK_USER:-}"
    PIKPAK_PASSWORD: "${PIKPAK_PASSWORD:-}"
    PIKPAK_LOCAL_ROOT: "${PIKPAK_LOCAL_ROOT:-/data/nanobot-home}"
    PIKPAK_REMOTE_PATH: "${PIKPAK_REMOTE_PATH:-nanobot/.nanobot}"
    PIKPAK_SYNC_INTERVAL: "${PIKPAK_SYNC_INTERVAL:-2700}"
  # With PikPak enabled HOME moves to PIKPAK_LOCAL_ROOT and this bind mount is
  # left untouched; the entrypoint never replaces a populated volume. Without
  # PikPak it is the usual durable data directory.
  volumes:
    - ~/.nanobot:/home/nanobot/.nanobot
  cap_drop:
    - ALL
  # Entrypoint uses these to fix bind-mount ownership and drop to the nanobot user.
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  # Prevent the non-root process from regaining capabilities through setuid
  # binaries or file capabilities left inside the container image.
  security_opt:
    - no-new-privileges:true

services:
  nanobot-gateway:
    container_name: nanobot-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:18790:18790
      - 8765:8765
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-api:
    container_name: nanobot-api
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/nanobot/.nanobot/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
